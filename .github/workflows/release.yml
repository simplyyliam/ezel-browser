# Builds the Windows installers (plus the signed update bundles and latest.json) for a pushed v*
# tag and drafts its GitHub Release.
# Push the tag with `npm run release` (after /release prepared it); then test the
# draft's installers and publish it by hand.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Windows installers
    runs-on: windows-latest
    steps:
      - name: Check out the tag
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Read the release notes from CHANGELOG.md
        id: notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          app_version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$version" != "$app_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match tauri.conf.json ($app_version)"
            exit 1
          fi

          # The lines under "## [X.Y.Z]" up to the next "## [", without leading or trailing blank lines.
          notes="$RUNNER_TEMP/notes.md"
          awk -v heading="## [$version]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found && NF == 0 { blanks = blanks "\n"; next }
            found { if (started) printf "%s", blanks; blanks = ""; started = 1; print }
          ' CHANGELOG.md > "$notes"
          if [ ! -s "$notes" ]; then
            echo "::error::CHANGELOG.md has no section for [$version]"
            exit 1
          fi

          {
            echo "version=$version"
            echo "body<<EZEL_RELEASE_NOTES"
            cat "$notes"
            echo "EZEL_RELEASE_NOTES"
          } >> "$GITHUB_OUTPUT"

      - name: Build the installers and draft the release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Auto-updates: the updater key signs the update bundles (not Windows code signing).
          # Both are repository secrets, never committed; the public key is in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Ezel ${{ steps.notes.outputs.version }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          # Not a pre-release: installed Ezel looks for updates at releases/latest, which skips
          # pre-releases. The draft only goes out when it's published by hand.
          prerelease: false
          # tauri.release.conf.json turns on the signed update bundles (only here: local builds
          # have no private key).
          args: --bundles nsis,msi --config src-tauri/tauri.release.conf.json
          # latest.json (version, download URLs, signatures) goes on the release with the installers.
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
