[package]
name = "app"
version = "0.3.1"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Measurement only: EZEL_PERF_URLS opens tabs at startup in a throwaway session (src/browser/perf.rs,
# scripts/measure-memory.ps1). Never in normal builds.
perf = []

[build-dependencies]
tauri-build = { version = "2.6.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.0", features = ["unstable", "specta"] }
tauri-plugin-log = "2"
# Auto-updates (src/updater.rs): signed with Ezel's updater key, checked against GitHub releases.
tauri-plugin-updater = "2"
# Import from Zen: its session files are Mozilla-LZ4 (pure Rust, no unsafe decoding).
lz4_flex = { version = "0.11", default-features = false, features = ["safe-decode", "safe-encode", "std"] }
# Typed bindings (same setup as Foundry). specta crates are pinned exactly while tauri-specta v2 is in RC.
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "=0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }

[target.'cfg(windows)'.dependencies]
# Same version webview2-com uses, so its HWND type matches ours.
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
  "Win32_System_Registry",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }
# Same version wry uses: WebView2 event handlers (keyboard shortcuts from the content webview).
webview2-com = "0.39"
# The page's picture (capture_page) goes to the UI as base64; already in the tree through Tauri.
base64 = "0.22"
